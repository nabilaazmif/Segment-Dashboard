# Resource bundle for segmentkpi (Segment Dashboard)

#XTIT: Application name
appTitle=Segment Dashboard

#YDES: Application description
appDescription=Quarterly revenue, profit and margin by business segment.

#XTIT: Main view title
title=Segment Dashboard

# --- Filter bar -------------------------------------------------------------

#XFLD: Label of the year filter
filterYear=Year

#XFLD: Label of the quarter filter
filterQuarter=Quarter

#XFLD: Quarter entry in the filter list, {0} = quarter number
quarterItem=Q{0}

# --- Cards ------------------------------------------------------------------

#XTIT: Card title
cardRevenue=Revenue by segment

#XTIT: Card title
cardGrossProfit=Gross profit by segment

#XTIT: Card title
cardGpm=Gross profit margin

#XTIT: Card title
cardPat=Profit after tax

#XTIT: Card title
cardNpm=Net profit margin

#XTIT: Card title
cardForex=Forex gain and loss

#XTIT: Card title
cardPie=Revenue share by segment

#XFLD: Card subtitle, unit of the figures
unitMillionIdr=In millions of IDR

#XFLD: Card subtitle, unit of the figures
unitThousandIdr=In thousands of IDR

#XFLD: Card subtitle, unit of the figures
unitPercent=In percent

#XFLD: Card subtitle of the comparison card
cardPieSubtitle=Own filter: one quarter against one quarter

# --- Chart dimensions and measures -----------------------------------------

#XFLD: Name of the year dimension in charts
dimYear=Year

#XFLD: Name of the quarter dimension in charts
dimQuarter=Quarter

#XFLD: Name of the segment dimension in charts
dimSegment=Segment

#XFLD: Name of the value measure in charts
measValue=Value

#XFLD: Name of the revenue measure in the donut charts
measRevenue=Revenue

# --- Tables -----------------------------------------------------------------

#XBUT: Tooltip of the chart view switch
btnChart=Chart

#XBUT: Tooltip of the table view switch
btnTable=Table

#XCOL: Table column header
colSegment=Segment

#XCOL: Table column header of the comparison table
colFluctuation=Fluctuation

#XFLD: Shown instead of a ratio that cannot be calculated
notAvailable=n/a

#XFLD: Text of a table without rows
tableNoData=No data for the selected periods.

# --- Comparison card filter -------------------------------------------------

#XFLD: Tooltip of the comparison year selection
pieBaseYear=Comparison period, year

#XFLD: Tooltip of the comparison quarter selection
pieBaseQuarter=Comparison period, quarter

#XFLD: Tooltip of the main year selection
pieMainYear=Main period, year

#XFLD: Tooltip of the main quarter selection
pieMainQuarter=Main period, quarter

#XFLD: Period label, {0} = quarter number, {1} = year
periodLabel=Q{0} {1}

# --- Messages ---------------------------------------------------------------

#YMSG: Shown when the selected periods return no rows
msgNoData=There is no data for the selected periods.

#YMSG: Shown when the KPI table is still empty
msgNoDataAtAll=No segment data has been loaded yet. The dashboard stays empty until the first quarter is available.

#YMSG: Shown when the data contains more than one currency, {0} = list of currencies
msgMultiCurrency=The selected data contains more than one currency ({0}). The figures are hidden because they cannot be added up.

#YMSG: Shown in the comparison card when both periods are the same
msgPieSamePeriod=Select two different periods.

#YMSG: Shown in the comparison card when one period has no data, {0} = period
msgPieNoData=There is no data for {0}.

#YMSG: Shown in the comparison card when both periods have no data
msgPieNoDataBoth=There is no data for either of the two selected periods.

#XTIT: Title of the error dialog
msgRequestFailedTitle=Data could not be loaded

#YMSG: Shown when a read request fails
msgRequestFailed=The service ZUI_SB_SGD_DASH did not return the data. Check your authorisation for object ZFI_SGD and try again.
